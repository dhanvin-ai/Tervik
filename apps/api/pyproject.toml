[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tervik-api"
version = "0.2.0"
description = "Tervik account, ingestion, and conversation analytics API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "nats-py>=2.9,<3",
  "opentelemetry-proto>=1.30,<2",
  "protobuf>=5,<7",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "clickhouse-connect>=0.8,<1", "jsonschema>=4.23,<5"]
clickhouse = ["clickhouse-connect>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
