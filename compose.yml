name: tervik-foundation
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tervik
      POSTGRES_USER: tervik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/configure_docker.py first}
    volumes:
      - metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tervik -d tervik"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: tervik
      CLICKHOUSE_USER: tervik
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run python3 scripts/configure_docker.py first}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - events:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://tervik:${POSTGRES_PASSWORD}@postgres:5432/tervik
      TERVIK_ADMIN_TOKEN: ${TERVIK_ADMIN_TOKEN:?Run python3 scripts/configure_docker.py first}
      TERVIK_DEMO_ENABLED: ${TERVIK_DEMO_ENABLED:-false}
      TERVIK_CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: tervik
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: tervik
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TERVIK_LLM_MODEL: ${TERVIK_LLM_MODEL:-claude-opus-5-5}
      TERVIK_DASHBOARD_URL: ${TERVIK_DASHBOARD_URL:-http://localhost:4173}
    ports:
      - '127.0.0.1:${TERVIK_API_PORT:-8001}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  alerts:
    build: ./apps/api
    command: ["python", "-m", "app.jobs", "alerts"]
    environment:
      DATABASE_URL: postgresql+psycopg://tervik:${POSTGRES_PASSWORD}@postgres:5432/tervik
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TERVIK_LLM_MODEL: ${TERVIK_LLM_MODEL:-claude-opus-5-5}
      TERVIK_DASHBOARD_URL: ${TERVIK_DASHBOARD_URL:-http://localhost:4173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-tervik@localhost}
    depends_on:
      api:
        condition: service_healthy

  classifier:
    build: ./apps/api
    command: ["python", "-m", "app.jobs", "classify"]
    environment:
      DATABASE_URL: postgresql+psycopg://tervik:${POSTGRES_PASSWORD}@postgres:5432/tervik
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TERVIK_LLM_MODEL: ${TERVIK_LLM_MODEL:-claude-opus-5-5}
      TERVIK_DASHBOARD_URL: ${TERVIK_DASHBOARD_URL:-http://localhost:4173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-tervik@localhost}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - '127.0.0.1:${TERVIK_WEB_PORT:-4173}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  metadata:
  events:
