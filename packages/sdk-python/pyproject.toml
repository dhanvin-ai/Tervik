[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tervik"
version = "0.1.0"
description = "Server-side conversation and tool telemetry for Tervik"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
langchain = ["langchain-core>=0.1"]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/tervik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
