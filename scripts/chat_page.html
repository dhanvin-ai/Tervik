<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat · tracked by Tervik</title>
<style>
  :root {
    --bg: #0a0a0a; --side: #000; --line: rgba(255, 255, 255, .08); --line-strong: rgba(255, 255, 255, .16);
    --text: #ededed; --muted: #8a8a8a; --faint: #5c5c5c; --bubble: #1a1a1a; --hover: rgba(255, 255, 255, .05);
    --bad: #f87171; --bad-soft: rgba(248, 113, 113, .08); --bad-line: rgba(248, 113, 113, .3); --bad-text: #fca5a5;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
  button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }

  .side { display: flex; flex-direction: column; width: 260px; flex: none; padding: 14px 10px; border-right: 1px solid var(--line); background: var(--side); }
  .brand { padding: 6px 10px 14px; font-weight: 600; letter-spacing: -0.01em; }
  .brand small { display: block; color: var(--muted); font: 400 11.5px var(--mono); }
  .new { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 6px; font-size: 14px; }
  .new:hover { background: var(--hover); }
  .chats { flex: 1; overflow-y: auto; margin: 14px 0; }
  .chats p { margin: 0 10px 6px; color: var(--faint); font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; }
  .chat-link { display: block; width: 100%; padding: 8px 10px; border-radius: 6px; color: #c8c8c8; font-size: 14px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-link:hover, .chat-link.active { background: var(--hover); color: #fff; }
  .dash { display: block; padding: 10px; border-top: 1px solid var(--line); color: var(--text); font-size: 13.5px; text-decoration: none; }
  .dash:hover { text-decoration: underline; text-underline-offset: 3px; }
  .dash small { display: block; color: var(--muted); font: 11.5px var(--mono); }

  main { display: flex; flex: 1; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; border-bottom: 1px solid var(--line); }
  header strong { overflow: hidden; font-weight: 500; white-space: nowrap; text-overflow: ellipsis; }
  header span { margin-left: auto; color: var(--muted); font: 12px var(--mono); white-space: nowrap; }
  .menu { display: none; padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: 6px; }

  .log { flex: 1; overflow-y: auto; }
  .thread { max-width: 760px; margin: 0 auto; padding: 28px 20px 12px; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; padding: 40px 20px; text-align: center; }
  .empty h1 { margin: 0 0 8px; font-size: 28px; font-weight: 500; letter-spacing: -0.02em; }
  .empty p { margin: 0 0 26px; color: var(--muted); }
  .ideas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 620px; }
  .ideas button { padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: 8px; color: #d4d4d4; font-size: 14px; text-align: left; }
  .ideas button:hover { background: var(--hover); color: #fff; }

  .msg { margin-bottom: 26px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user div { max-width: 78%; padding: 10px 16px; border-radius: 18px; background: var(--bubble); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.assistant { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; }
  .avatar { width: 28px; height: 28px; border: 1px solid var(--line-strong); border-radius: 50%; background: radial-gradient(circle at 50% 50%, #fff 0 3px, transparent 4px); }
  .body { overflow-wrap: anywhere; }
  .body pre { overflow-x: auto; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: #000; font: 13px/1.5 var(--mono); }
  .body code { padding: 1px 5px; border-radius: 4px; background: #1c1c1c; font: 13px var(--mono); }
  .body pre code { padding: 0; background: none; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tool { padding: 3px 9px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--muted); font: 12px var(--mono); }
  .tool.failed { border-color: var(--bad-line); color: var(--bad-text); background: var(--bad-soft); }
  .flags { display: grid; gap: 6px; margin-top: 12px; }
  .flag { display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; border: 1px solid var(--bad-line); border-radius: 6px; background: var(--bad-soft); color: var(--bad-text); font-size: 13.5px; }
  .flag b { color: #fecaca; font-weight: 600; white-space: nowrap; }
  .flag a { margin-left: auto; color: var(--bad-text); font-size: 12.5px; white-space: nowrap; }
  .clean { margin-top: 8px; color: var(--faint); font: 12px var(--mono); }
  .typing span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: #9a9a9a; animation: blink 1.2s infinite both; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .error { margin-bottom: 20px; padding: 10px 14px; border: 1px solid var(--bad-line); border-radius: 8px; color: var(--bad-text); font-size: 14px; }

  .composer { max-width: 760px; width: 100%; margin: 0 auto; padding: 8px 20px 6px; }
  .box { display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px; border: 1px solid var(--line-strong); border-radius: 22px; background: #121212; }
  .box:focus-within { border-color: rgba(255, 255, 255, .32); }
  textarea { flex: 1; max-height: 200px; padding: 7px 0; border: 0; outline: none; background: none; resize: none; font-size: 15px; line-height: 1.5; }
  textarea::placeholder { color: var(--faint); }
  .send { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 50%; background: #fff; color: #000; font-size: 17px; font-weight: 700; }
  .send:disabled { background: #333; color: #777; cursor: default; }
  .note { margin: 6px 0 10px; color: var(--faint); font-size: 12px; text-align: center; }

  @media (max-width: 760px) {
    .side { position: fixed; z-index: 10; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .2s ease; }
    body.menu-open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .6); }
    .menu { display: block; }
    header span { display: none; }
    .ideas { grid-template-columns: minmax(0, 1fr); }
    .msg.user div { max-width: 88%; }
    .flag { flex-wrap: wrap; }
    .flag a { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } .side { transition: none; } }
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand">Chat assistant<small id="model"></small></div>
  <button class="new" id="new">＋ New chat</button>
  <nav class="chats" id="chats"></nav>
  <a class="dash" id="dash" target="_blank" rel="noopener">See failures in Tervik ↗<small id="project"></small></a>
</aside>
<main>
  <header><button class="menu" id="menu" aria-label="Show chats">☰</button><strong id="title">New chat</strong><span>tracked by Tervik</span></header>
  <section class="log" id="log"></section>
  <form class="composer" id="composer">
    <div class="box"><textarea id="input" rows="1" placeholder="Message the assistant" aria-label="Message"></textarea><button class="send" id="send" aria-label="Send" disabled>↑</button></div>
    <p class="note">Runs on your Mac. Every message goes to Tervik, which flags problems under the reply.</p>
  </form>
</main>
<script>
const CONFIG = __CONFIG__;
const IDEAS = ['Tell me a fun fact about space', 'What is 18% of 2,450?', 'What time is it in Tokyo?', 'Write a short birthday message for my friend'];
const $ = id => document.getElementById(id);
const state = { chatId: null, messages: [], busy: false, error: '' };

$('model').textContent = `${CONFIG.model} · ${CONFIG.persona}`;
$('project').textContent = `project “${CONFIG.project}”`;
$('dash').href = CONFIG.dashboard;

const escape = text => text.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function markdown(text) {
  return text.split(/```[\w-]*\n?([\s\S]*?)```/g).map((part, index) => index % 2
    ? `<pre><code>${escape(part.replace(/\n$/, ''))}</code></pre>`
    : escape(part).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')).join('');
}
function toolLine(tool) {
  const args = Object.values(tool.args || {}).map(v => typeof v === 'string' ? v : JSON.stringify(v)).join(', ');
  return `<span class="tool ${tool.ok ? '' : 'failed'}" title="${escape(tool.output || '')}">${tool.ok ? '⚙' : '✕'} ${escape(tool.name)}(${escape(args)})${tool.ok ? '' : ' failed'}</span>`;
}
function messageHtml(message) {
  if (message.role === 'user') return `<div class="msg user"><div>${escape(message.content)}</div></div>`;
  const tools = message.tools?.length ? `<div class="tools">${message.tools.map(toolLine).join('')}</div>` : '';
  const flags = message.flags?.length
    ? `<div class="flags">${message.flags.map(f => `<div class="flag"><b>⚑ ${escape(f.label)}</b><span>${escape(f.reason)}</span><a href="${CONFIG.dashboard}" target="_blank" rel="noopener">View in Tervik</a></div>`).join('')}</div>`
    : '<div class="clean">Tervik: no problems found in this turn</div>';
  return `<div class="msg assistant"><span class="avatar"></span><div class="body">${markdown(message.content)}${tools}${flags}</div></div>`;
}
function render() {
  const log = $('log');
  if (!state.messages.length && !state.busy) {
    log.innerHTML = `<div class="empty"><h1>What’s on your mind?</h1><p>Ask anything. Tervik watches the conversation for problems.</p><div class="ideas">${IDEAS.map(i => `<button type="button">${escape(i)}</button>`).join('')}</div></div>`;
    log.querySelectorAll('.ideas button').forEach(button => button.onclick = () => send(button.textContent));
    return;
  }
  log.innerHTML = `<div class="thread">${state.messages.map(messageHtml).join('')}${state.busy ? '<div class="msg assistant"><span class="avatar"></span><div class="typing"><span></span><span></span><span></span></div></div>' : ''}${state.error ? `<div class="error">${escape(state.error)}</div>` : ''}</div>`;
  log.scrollTop = log.scrollHeight;
}
async function loadChats() {
  const chats = await fetch('/api/chats').then(r => r.json()).catch(() => []);
  $('chats').innerHTML = chats.length ? '<p>Chats</p>' + chats.map(c => `<button class="chat-link ${c.id === state.chatId ? 'active' : ''}" data-id="${escape(c.id)}">${escape(c.title)}</button>`).join('') : '';
  $('chats').querySelectorAll('.chat-link').forEach(button => button.onclick = () => openChat(button.dataset.id));
}
async function openChat(id) {
  const chat = await fetch(`/api/chats/${encodeURIComponent(id)}`).then(r => r.json());
  Object.assign(state, { chatId: chat.id, messages: chat.messages, error: '' });
  $('title').textContent = chat.title;
  document.body.classList.remove('menu-open');
  render(); loadChats(); $('input').focus();
}
function newChat() {
  Object.assign(state, { chatId: null, messages: [], error: '' });
  $('title').textContent = 'New chat';
  document.body.classList.remove('menu-open');
  render(); loadChats(); $('input').focus();
}
async function send(text) {
  text = text.trim();
  if (!text || state.busy) return;
  state.messages.push({ role: 'user', content: text });
  Object.assign(state, { busy: true, error: '' });
  $('input').value = ''; resize(); update(); render();
  try {
    const response = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: state.chatId, message: text }) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Something went wrong');
    state.chatId = data.chat_id;
    state.messages.push(data.message);
    $('title').textContent = data.title;
    loadChats();
  } catch (error) {
    state.messages.pop();
    state.error = error.message;
    $('input').value = text; resize();
  } finally {
    state.busy = false; update(); render(); $('input').focus();
  }
}
function resize() { const box = $('input'); box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight, 200) + 'px'; }
function update() { $('send').disabled = state.busy || !$('input').value.trim(); }
$('input').addEventListener('input', () => { resize(); update(); });
$('input').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); send($('input').value); } });
$('composer').addEventListener('submit', event => { event.preventDefault(); send($('input').value); });
$('new').onclick = newChat;
$('menu').onclick = () => document.body.classList.toggle('menu-open');
render(); loadChats(); $('input').focus();
</script>
</body>
</html>
